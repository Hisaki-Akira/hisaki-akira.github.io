<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        header a {
            text-decoration: none;
            color: #0077ff;
            font-weight: bold;
        }

        main {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            border-radius: 16px;
            display: block;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">← Home</a>
</header>

<main>

    <h1>Gallery</h1>

    <div class="gallery">
        <img src="gallery/photo1.jpg" alt="">
        <img src="gallery/photo2.jpg" alt="">
        <img src="gallery/photo3.jpg" alt="">
        <img src="gallery/photo4.jpg" alt="">
        <img src="gallery/photo5.jpg" alt="">
        <img src="gallery/photo6.jpg" alt="">
    </div>

</main>

</body>
</html>
